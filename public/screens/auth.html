<div id="auth-screen" class="screen">
  <div class="auth-wrapper">
    <div class="auth-illustration">
      <div class="auth-illustration-content">
        <div id="auth-mascots-container" class="auth-mascots-container">
          <div class="mascots-row">
            <div id="mascot-1" class="mascot-character mascot-grey">
              <svg viewBox="0 0 100 100" class="mascot-svg" shape-rendering="geometricPrecision">
                <polygon id="grey-cat-ear-left" points="28,10 33.28,-5 44.72,10" fill="#64748b" stroke="#26190f" stroke-width="3.5" stroke-linejoin="round" />
                <polygon id="grey-cat-ear-left-inner" points="31.52,8.5 33.72,-1.5 41.20,8.5" fill="#cbd5e1" stroke="#26190f" stroke-width="1.5" stroke-linejoin="round" />
                <polygon id="grey-cat-ear-right" points="55.28,10 66.72,-5 72,10" fill="#64748b" stroke="#26190f" stroke-width="3.5" stroke-linejoin="round" />
                <polygon id="grey-cat-ear-right-inner" points="58.80,8.5 66.28,-1.5 68.48,8.5" fill="#cbd5e1" stroke="#26190f" stroke-width="1.5" stroke-linejoin="round" />
                <path id="grey-cat-tail" d="M 28 82 C 5 70, -5 52, 10 38" fill="none" stroke="#26190f" stroke-width="8" stroke-linecap="round" />
                <polygon id="grey-mascot-body" points="6,92 94,92 84,10 16,10" fill="#64748b" stroke="#26190f" stroke-width="3.5" stroke-linejoin="round" />
                <g id="grey-mascot-eye">
                  <ellipse id="grey-eye-bg" cx="50" cy="35" rx="8.5" ry="8.5" fill="#ffffff" stroke="#26190f" stroke-width="2.5" />
                  <ellipse id="grey-eye-pupil" cx="50" cy="35" rx="3.5" ry="3.5" fill="#26190f" />
                  <ellipse id="grey-eye-shine" cx="48" cy="33" rx="1.2" ry="1.2" fill="#ffffff" />
                </g>
                <polygon id="grey-cat-nose" points="50,47 47.5,44 52.5,44" fill="#26190f" />
                <g id="grey-cat-whiskers" stroke="#26190f" stroke-width="2" stroke-linecap="round">
                  <g id="grey-whiskers-left">
                    <line id="gwl1" x1="39.5" y1="33" x2="26.5" y2="29" />
                    <line id="gwl2" x1="38.5" y1="38" x2="24.5" y2="38" />
                    <line id="gwl3" x1="39.5" y1="43" x2="27.5" y2="46" />
                  </g>
                  <g id="grey-whiskers-right">
                    <line id="gwr1" x1="60.5" y1="33" x2="73.5" y2="29" />
                    <line id="gwr2" x1="61.5" y1="38" x2="75.5" y2="38" />
                    <line id="gwr3" x1="60.5" y1="43" x2="72.5" y2="46" />
                  </g>
                </g>
              </svg>
            </div>
            <div id="mascot-2" class="mascot-character mascot-kiko">
              <svg viewBox="0 0 100 100" class="mascot-svg" shape-rendering="geometricPrecision">
                <polygon id="cat-ear-left" points="28,10 33.28,-5 44.72,10" fill="#f97316" stroke="#26190f" stroke-width="3.5" stroke-linejoin="round" />
                <polygon id="cat-ear-left-inner" points="31.52,8.5 33.72,-1.5 41.20,8.5" fill="#fca5a5" stroke="#26190f" stroke-width="1.5" stroke-linejoin="round" />
                <polygon id="cat-ear-right" points="55.28,10 66.72,-5 72,10" fill="#f97316" stroke="#26190f" stroke-width="3.5" stroke-linejoin="round" />
                <polygon id="cat-ear-right-inner" points="58.80,8.5 66.28,-1.5 68.48,8.5" fill="#fca5a5" stroke="#26190f" stroke-width="1.5" stroke-linejoin="round" />
                <path id="cat-tail" d="M 72 82 C 95 70, 105 52, 90 38" fill="none" stroke="#26190f" stroke-width="7" stroke-linecap="round" />
                <polygon id="mascot-body" points="20,92 80,92 72,10 28,10" fill="#f97316" stroke="#26190f" stroke-width="3.5" stroke-linejoin="round" />
                <g id="mascot-eye">
                  <ellipse id="eye-bg" cx="50" cy="35" rx="8.5" ry="8.5" fill="#ffffff" stroke="#26190f" stroke-width="2.5" />
                  <ellipse id="eye-pupil" cx="50" cy="35" rx="3.5" ry="3.5" fill="#26190f" />
                  <ellipse id="eye-shine" cx="48" cy="33" rx="1.2" ry="1.2" fill="#ffffff" />
                </g>
                <polygon id="cat-nose" points="50,47 47.5,44 52.5,44" fill="#26190f" />
                <g id="cat-whiskers" stroke="#26190f" stroke-width="2" stroke-linecap="round">
                  <g id="whiskers-left">
                    <line id="wl1" x1="39.5" y1="33" x2="26.5" y2="29" />
                    <line id="wl2" x1="38.5" y1="38" x2="24.5" y2="38" />
                    <line id="wl3" x1="39.5" y1="43" x2="27.5" y2="46" />
                  </g>
                  <g id="whiskers-right">
                    <line id="wr1" x1="60.5" y1="33" x2="73.5" y2="29" />
                    <line id="wr2" x1="61.5" y1="38" x2="75.5" y2="38" />
                    <line id="wr3" x1="60.5" y1="43" x2="72.5" y2="46" />
                  </g>
                </g>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <div class="auth-form-container card">
      <h1 id="auth-title" data-i18n="nav.login">Connexion</h1>
      <p id="auth-subtitle" class="text-muted">Connectez-vous pour enregistrer vos scores.</p>
      
      <div class="google-auth-container">
        <div id="google-login-btn"></div>
      </div>

      <div class="auth-separator">
        <span data-i18n="auth.or">OU</span>
      </div>

      <form id="auth-form" action="#" method="POST" novalidate onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="auth-username">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="label-icon" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span data-i18n="welcome.player">Nom d'utilisateur</span>
          </label>
          <input 
            type="text" 
            id="auth-username" 
            name="username"
            placeholder="Ex: Dupont" 
            autocomplete="username"
            maxlength="30"
            class="input-premium"
          />
        </div>
        
        <div class="form-group">
          <label for="auth-password">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="label-icon" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <span data-i18n="auth.password">Mot de passe</span>
          </label>
          <div class="password-input-container">
            <input 
              type="password" 
              id="auth-password" 
              name="password"
              placeholder="••••••••" 
              autocomplete="current-password"
              maxlength="72"
              class="input-premium"
            />
            <button type="button" id="toggle-password-btn" class="toggle-password-btn" title="Afficher/Masquer le mot de passe" aria-label="Afficher le mot de passe">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-svg"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        
        <div id="auth-error" class="error-msg hidden" role="alert" aria-live="polite"></div>
        
        <div class="auth-actions">
          <button type="submit" id="auth-main-btn" class="btn btn-primary btn-glow" data-i18n="nav.login">Se connecter</button>
          <div class="auth-link-container">
            <span id="auth-switch-text" class="text-muted">Pas encore de compte ?</span>
            <button type="button" id="auth-switch-link" class="auth-link">Créer un compte</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
