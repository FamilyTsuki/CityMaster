<div id="profile-screen" class="screen">
  <div class="card profile-card" role="region" aria-label="Page de profil utilisateur">
    <div class="profile-card-header">
      <button id="profile-back-arrow-btn" class="btn-back-round" title="Retour à l'accueil">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="action-icon"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <div class="profile-avatar-container">
        <img id="profile-page-img" src="/assets/images/default-avatar.png" alt="Mon Avatar" class="profile-avatar" />
        <label for="profile-upload" class="upload-btn" title="Changer d'avatar" data-i18n-title="profile.avatar_title" aria-label="Changer ma photo de profil">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="camera-icon" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </label>
        <input type="file" id="profile-upload" class="hidden" accept="image/png, image/jpeg, image/webp" />
      </div>
      <h1 id="profile-page-name">Joueur</h1>
    </div>
    
    <div class="profile-stats">
      <div class="stat-box">
        <span class="stat-label" data-i18n="profile.total_score">Score Total</span>
        <span id="profile-total-score" class="stat-value">0</span>
      </div>
    </div>

    <div id="profile-error" class="error-msg hidden" role="alert" aria-live="polite"></div>
    <div id="profile-success" class="success-msg hidden" role="alert" aria-live="polite"></div>

    <div class="profile-actions">
      <div class="theme-switch-container custom-dropdown-wrapper">
        <span class="setting-label" data-i18n="profile.language">Langue / Language</span>
        <div class="custom-select-box">
          <button type="button" id="profile-lang-trigger" class="custom-select-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="profile-lang-current">Français (FR)</span>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="select-chevron" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <ul id="profile-lang-dropdown" class="custom-select-menu hidden" role="listbox">
            <li data-value="fr" role="option" class="custom-select-item selected">Français (FR)</li>
            <li data-value="en" role="option" class="custom-select-item">English (EN)</li>
          </ul>
          <input type="hidden" id="profile-lang-select" value="fr" />
        </div>
      </div>

      <div class="theme-switch-container">
        <span class="setting-label" data-i18n="profile.sound_effects">Effets Sonores</span>
        <label class="switch">
          <input type="checkbox" id="profile-sound-switch" />
          <span class="slider round"></span>
        </label>
      </div>

      <div class="theme-switch-container">
        <span class="setting-label" data-i18n="profile.dark_mode">Mode Sombre</span>
        <label class="switch">
          <input type="checkbox" id="profile-theme-switch" />
          <span class="slider round"></span>
        </label>
      </div>

      <button id="profile-logout-btn" class="profile-logout-link" data-i18n="profile.logout">Se déconnecter</button>
      <button id="profile-legal-btn" class="legal-footer-link profile-legal-link" data-i18n="nav.legal">Mentions Légales & RGPD</button>
    </div>
  </div>
</div>
