<div id="load-screen" class="screen load-screen" role="region" aria-label="Écran de chargement" data-i18n-aria-label="common.loading">
  <!-- Structure accessible et de secours pour lecteurs d'écran et compatibilité -->
  <div class="loader-container" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">
    <div class="loader-spinner" role="status" aria-label="Chargement en cours" data-i18n-aria-label="common.loading"></div>
    <p id="load-page-message" class="loading-message" aria-live="polite" data-i18n="loading.loading_streets">
      Chargement de CityMaster...
    </p>
  </div>

  <!-- Plateau d'animation Cartoon du Vol, Monuments & Crash -->
  <div class="flight-loader-stage" role="main">
    <!-- En-tête : Badge Radar & Titre -->
    <header class="flight-header">
      <div class="flight-badge">
        <span class="flight-radar-dot" aria-hidden="true"></span>
        <span class="flight-code" data-i18n="flight.flight_badge">VOL CM-742</span>
      </div>
      <h1 class="flight-title" data-i18n="flight.flight_title">En vol vers la destination</h1>
      <p id="flight-status-text" class="flight-status-text" role="status" aria-live="polite" data-i18n="flight.takeoff">
        Décollage imminent...
      </p>
    </header>

    <!-- Le Ciel & Trajectoire avec l'Avion et les Monuments -->
    <div id="flight-sky" class="flight-sky" aria-hidden="true">
      <!-- Nuages d'arrière-plan -->
      <div class="sky-clouds">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
      </div>

      <!-- Ligne pointillée de la trajectoire -->
      <div class="flight-path-line"></div>

      <!-- Monuments et Site du Crash -->
      <div class="flight-monuments">
        <!-- Monument 1 : Tour Eiffel (Paris) à ~28% -->
        <div id="monument-1" class="monument-item">
          <div class="monument-popup">
            <span class="monument-tag" data-i18n="flight.step_1">ÉTAPE 1</span>
            <span class="monument-name" data-i18n="flight.monument_eiffel">Tour Eiffel - Paris</span>
          </div>
          <div class="monument-pin">
            <svg class="monument-icon" viewBox="0 0 60 70" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Tour Eiffel stylisée Cartoon -->
              <path d="M28 2 H32 V12 H28 Z" fill="#ea580c"/>
              <circle cx="30" cy="3" r="3" fill="#fbbf24"/>
              <path d="M25 12 H35 L38 28 H22 L25 12 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
              <rect x="20" y="28" width="20" height="4" rx="2" fill="#ea580c"/>
              <path d="M22 32 L15 54 H45 L38 32 H22 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
              <rect x="12" y="54" width="36" height="5" rx="2" fill="#ea580c"/>
              <!-- Arche inférieure -->
              <path d="M12 59 L8 68 H20 C20 60 40 60 40 68 H52 L48 59 H12 Z" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
              <path d="M22 68 C22 62 38 62 38 68" fill="none" stroke="#ea580c" stroke-width="2"/>
            </svg>
            <div class="monument-base-marker"></div>
          </div>
        </div>

        <!-- Monument 2 : Château de la Loire (Chambord) à ~56% -->
        <div id="monument-2" class="monument-item">
          <div class="monument-popup">
            <span class="monument-tag" data-i18n="flight.step_2">ÉTAPE 2</span>
            <span class="monument-name" data-i18n="flight.monument_chambord">Château de la Loire</span>
          </div>
          <div class="monument-pin">
            <svg class="monument-icon" viewBox="0 0 70 65" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Château féerique Cartoon -->
              <!-- Donjon central -->
              <rect x="25" y="25" width="20" height="38" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
              <polygon points="35,6 23,25 47,25" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
              <circle cx="35" cy="5" r="2.5" fill="#fbbf24"/>
              <!-- Tour gauche -->
              <rect x="10" y="32" width="14" height="31" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
              <polygon points="17,16 8,32 26,32" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
              <!-- Tour droite -->
              <rect x="46" y="32" width="14" height="31" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
              <polygon points="53,16 44,32 62,32" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
              <!-- Porte & créneaux -->
              <path d="M30 63 V48 C30 45 40 45 40 48 V63 Z" fill="#ea580c"/>
              <line x1="12" y1="36" x2="16" y2="36" stroke="#fbbf24" stroke-width="2"/>
              <line x1="48" y1="36" x2="52" y2="36" stroke="#fbbf24" stroke-width="2"/>
            </svg>
            <div class="monument-base-marker"></div>
          </div>
        </div>

        <!-- Monument 3 : Mont-Saint-Michel à ~78% -->
        <div id="monument-3" class="monument-item">
          <div class="monument-popup">
            <span class="monument-tag" data-i18n="flight.step_3">ÉTAPE 3</span>
            <span class="monument-name" data-i18n="flight.monument_mont">Mont-Saint-Michel</span>
          </div>
          <div class="monument-pin">
            <svg class="monument-icon" viewBox="0 0 70 65" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Rocher du Mont -->
              <path d="M8 63 Q20 48 35 45 Q50 48 62 63 Z" fill="#78716c" stroke="#57534e" stroke-width="1.5"/>
              <!-- Remparts & Abbaye -->
              <rect x="22" y="30" width="26" height="18" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
              <polygon points="35,8 26,30 44,30" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
              <!-- Flèche et archange doré -->
              <line x1="35" y1="8" x2="35" y2="2" stroke="#ea580c" stroke-width="2"/>
              <circle cx="35" cy="2" r="2.5" fill="#fbbf24"/>
              <!-- Vaguelettes d'eau -->
              <path d="M5 63 Q15 60 25 63 T45 63 T65 63" fill="none" stroke="#38bdf8" stroke-width="2"/>
            </svg>
            <div class="monument-base-marker"></div>
          </div>
        </div>

        <!-- Site du Crash & Point d'interrogation mystère à ~93% -->
        <div id="crash-destination" class="crash-destination">
          <div class="crash-crater"></div>
          <div class="crash-burst" aria-hidden="true">💥</div>
          <div class="crash-smoke" aria-hidden="true">
            <div class="smoke-puff p1"></div>
            <div class="smoke-puff p2"></div>
            <div class="smoke-puff p3"></div>
          </div>
          <!-- Le Point d'interrogation Géant Cartoon -->
          <div id="mystery-question-mark" class="mystery-question-mark">
            <div class="question-mark-glyph">?</div>
            <div class="mystery-badge" data-i18n="flight.mystery">Où sommes-nous ?</div>
          </div>
          <div class="monument-base-marker"></div>
        </div>
      </div>

      <!-- Avion de Ville : Châssis volant et hélice animée -->
      <div id="airplane-carrier" class="airplane-carrier flying">
        <div class="plane-smoke-trail"></div>
        <div class="plane-wrapper">
          <svg class="plane-svg" viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Aile inférieure -->
            <path d="M42 34 L25 48 C23 49.5 20 48.5 21 46 L30 35 Z" fill="#c2410c" stroke="#9a3412" stroke-width="1.5"/>
            <!-- Fuselage -->
            <path d="M12 28 C12 22 18 18 30 18 L76 18 C85 18 92 24 92 28 C92 32 85 38 76 38 L30 38 C18 38 12 34 12 28 Z" fill="#f97316"/>
            <!-- Ventre blanc / argenté -->
            <path d="M14 30 C16 34 22 37 32 37 L74 37 C82 37 88 33 90 30 C86 34 80 37 72 37 L30 37 C20 37 15 33 14 30 Z" fill="#f8fafc"/>
            <!-- Dérive / Queue de l'avion -->
            <path d="M12 28 L4 10 C3 8 5.5 6 7.5 7.5 L24 20 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
            <!-- Pare-brise / Cockpit cartoon -->
            <path d="M68 20 Q76 20 80 25 L65 25 Q64 20 68 20 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.2"/>
            <path d="M70 21 Q75 21 77 24" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
            <!-- Hublots -->
            <circle cx="56" cy="25" r="2.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
            <circle cx="46" cy="25" r="2.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
            <circle cx="36" cy="25" r="2.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
            <!-- Aile principale supérieure -->
            <path d="M44 26 L22 8 C20 6.5 22.5 4 25 5 L58 24 Z" fill="#ea580c" stroke="#c2410c" stroke-width="1.5"/>
            <path d="M26 8 L54 24" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round"/>
            <!-- Nez et Moyeu d'hélice -->
            <path d="M90 24 C93 24 94 26 94 28 C94 30 93 32 90 32 Z" fill="#1e293b"/>
            <!-- Hélice tournante -->
            <g class="plane-propeller">
              <ellipse cx="94" cy="28" rx="2" ry="16" fill="#cbd5e1" opacity="0.85" stroke="#475569" stroke-width="0.8"/>
              <circle cx="94" cy="28" r="3.5" fill="#ea580c"/>
            </g>
          </svg>
        </div>
      </div>

      <!-- Barre de progression au sol & balises -->
      <div class="flight-progress-track">
        <div id="flight-progress-bar" class="flight-progress-bar" style="width: 0%;"></div>
        <span class="track-marker marker-0"></span>
        <span class="track-marker marker-25"></span>
        <span class="track-marker marker-55"></span>
        <span class="track-marker marker-80"></span>
        <span class="track-marker marker-100"></span>
      </div>
    </div>

    <!-- Informations de vol inférieures : Pourcentage & Destination -->
    <div class="flight-footer-info">
      <div class="flight-percentage-box">
        <span id="flight-percentage" class="flight-percentage-val">0%</span>
        <span id="flight-destination-label" class="flight-destination-label" data-i18n="flight.cruising">En vol de croisière...</span>
      </div>
    </div>

    <!-- Barre d'actions et de tests du Loader -->
    <section class="flight-controls-panel" aria-label="Contrôles de test de l'animation">
      <button id="btn-flight-replay" class="ctrl-btn" type="button">
        <span aria-hidden="true">🔄</span>
        <span data-i18n="flight.replay">Rejouer</span>
      </button>

      <button id="btn-flight-pause" class="ctrl-btn" type="button">
        <span id="btn-flight-pause-icon" aria-hidden="true">⏸️</span>
        <span id="btn-flight-pause-label" data-i18n="flight.pause">Pause</span>
      </button>

      <button id="btn-flight-crash" class="ctrl-btn alert-btn" type="button">
        <span aria-hidden="true">💥</span>
        <span data-i18n="flight.crash_now">Crash immédiat</span>
      </button>

      <div class="ctrl-slider-group">
        <label for="flight-slider" data-i18n="flight.progress_label">Progression :</label>
        <input type="range" id="flight-slider" class="ctrl-range" min="0" max="100" value="0" step="1" aria-label="Progression du vol" />
      </div>

      <button id="btn-flight-theme" class="ctrl-btn icon-only" type="button" title="Basculer thème" aria-label="Basculer le mode clair ou sombre" data-i18n-aria-label="flight.toggle_theme">
        <span aria-hidden="true">🌓</span>
      </button>
    </section>
  </div>
</div>
