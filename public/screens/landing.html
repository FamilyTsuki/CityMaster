<div id="landing-screen" class="screen">
  <svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
    <filter id="paper-wobbly-line">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="landing-content">

    <div class="hero">
      <h1 class="hero-title" data-i18n="landing.hero_title">Maîtrisez la Géographie de <span class="title-highlight">Votre Ville</span></h1>
      
      <div class="hero-actions">
        <button id="hero-play-btn" class="btn hero-btn paper-btn primary-paper-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="action-icon" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <span data-i18n="landing.play_now">Jouer maintenant</span>
        </button>
        <button id="hero-room-btn" class="btn hero-btn secondary-paper-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="action-icon" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <span data-i18n="landing.team_rooms">Compétition Équipe</span>
        </button>
      </div>
    </div>

    <div class="landing-footer-actions">
      <button id="landing-legal-btn" class="legal-footer-link paper-footer-btn" data-i18n="nav.legal">Mentions Légales & RGPD</button>
      <button id="landing-support-btn" class="support-footer-link paper-footer-btn" data-i18n="nav.support">💖 Soutenir le projet</button>
    </div>
  </div>
</div>
