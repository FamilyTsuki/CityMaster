<div
  id="moderation-screen"
  class="screen"
  role="region"
  aria-labelledby="moderation-title"
>
  <div class="moderation-container">
    <div class="moderation-header">
      <div class="moderation-header-top">
        <button
          id="moderation-back-btn"
          class="btn-back-round"
          title="Retour"
          data-i18n-title="common.back"
          aria-label="Retour"
          data-i18n-aria-label="common.back"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="action-icon"
            aria-hidden="true"
          >
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <div class="moderation-body">
      <div class="moderation-card">
        <h1
          id="moderation-title"
          class="coming-soon-title"
          data-i18n="moderation.coming_soon"
        >
          Coming Soon
        </h1>
      </div>
    </div>
  </div>
</div>
