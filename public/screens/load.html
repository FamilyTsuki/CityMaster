<div id="load-screen" class="screen load-screen" role="region" aria-label="Écran de chargement" data-i18n-aria-label="common.loading">
  <!-- Structure accessible et de secours pour lecteurs d'écran et compatibilité -->
  <div class="loader-container" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0;">
    <div class="loader-spinner" role="status" aria-label="Chargement en cours" data-i18n-aria-label="common.loading"></div>
    <p id="load-page-message" class="loading-message" aria-live="polite" data-i18n="loading.loading_streets">
      Chargement de CityMaster...
    </p>
  </div>

  <!-- Plateau d'animation Minimaliste du Vol, Trajectoire en Courbe & Crash -->
  <div class="flight-loader-stage" role="main">
    <!-- En-tête épuré : Titre moderne & Statut -->
    <header class="flight-header">
      <div class="flight-badge" style="display: none;">
        <span class="flight-radar-dot" aria-hidden="true"></span>
        <span class="flight-code" data-i18n="flight.flight_badge">VOL CM-742</span>
      </div>
      <h1 class="flight-title" data-i18n="flight.flight_title">En vol vers la destination</h1>
      <p id="flight-status-text" class="flight-status-text" role="status" aria-live="polite" data-i18n="flight.takeoff">
        Décollage imminent...
      </p>
    </header>

    <!-- Le Ciel & Trajectoire en courbe épurée -->
    <div id="flight-sky" class="flight-sky" aria-hidden="true">
      <!-- Trajectoire de vol en courbe (Arc parabolique fin et élégant) -->
      <svg class="flight-curve-svg" viewBox="0 0 1000 260" preserveAspectRatio="none" aria-hidden="true">
        <path class="flight-curve-track" d="M 60 187 Q 500 47 920 213" fill="none" stroke="rgba(249, 115, 22, 0.45)" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round" />
      </svg>

      <!-- Monuments flottant AU-DESSUS du vol et Site du Crash (Design épuré) -->
      <div class="flight-monuments">
        <!-- Monument 1 : Tour Eiffel (Paris) à ~28%, visible UNIQUEMENT quand l'avion y arrive -->
        <div id="monument-1" class="monument-item monument-above">
          <div class="monument-card">
            <svg class="monument-icon" viewBox="0 0 32 36" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 2 H17 V6 H15 Z" fill="#f97316"/>
              <path d="M14 6 L11 18 H21 L18 6 Z" fill="none" stroke="#64748b" stroke-width="1.5"/>
              <line x1="9" y1="18" x2="23" y2="18" stroke="#f97316" stroke-width="1.5"/>
              <path d="M11 18 L6 34 H12 C12 28 20 28 20 34 H26 L21 18" fill="none" stroke="#64748b" stroke-width="1.5"/>
              <path d="M12 34 C12 29 20 29 20 34" fill="none" stroke="#f97316" stroke-width="1.5"/>
            </svg>
            <span class="monument-tag" data-i18n="flight.step_1" style="display: none;">ÉTAPE 1</span>
            <span class="monument-name" data-i18n="flight.monument_eiffel">Tour Eiffel - Paris</span>
          </div>
          <div class="monument-pointer" aria-hidden="true"></div>
        </div>

        <!-- Monument 2 : Château de la Loire (Chambord) à ~56%, au-dessus du vol -->
        <div id="monument-2" class="monument-item monument-above">
          <div class="monument-card">
            <svg class="monument-icon" viewBox="0 0 36 34" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 2 L13 11 H23 Z" fill="#f97316"/>
              <rect x="14" y="11" width="8" height="21" fill="none" stroke="#64748b" stroke-width="1.5"/>
              <path d="M6 8 L3 14 H9 Z" fill="#f97316"/>
              <rect x="4" y="14" width="4" height="18" fill="none" stroke="#64748b" stroke-width="1.2"/>
              <path d="M30 8 L27 14 H33 Z" fill="#f97316"/>
              <rect x="28" y="14" width="4" height="18" fill="none" stroke="#64748b" stroke-width="1.2"/>
              <line x1="8" y1="20" x2="28" y2="20" stroke="#64748b" stroke-width="1.2"/>
              <path d="M16 32 V26 C16 25 20 25 20 26 V32" fill="none" stroke="#f97316" stroke-width="1.5"/>
            </svg>
            <span class="monument-tag" data-i18n="flight.step_2" style="display: none;">ÉTAPE 2</span>
            <span class="monument-name" data-i18n="flight.monument_chambord">Château de la Loire</span>
          </div>
          <div class="monument-pointer" aria-hidden="true"></div>
        </div>

        <!-- Monument 3 : Mont-Saint-Michel à ~78%, au-dessus du vol -->
        <div id="monument-3" class="monument-item monument-above">
          <div class="monument-card">
            <svg class="monument-icon" viewBox="0 0 36 34" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="18" y1="2" x2="18" y2="8" stroke="#f97316" stroke-width="1.5"/>
              <polygon points="18,8 14,18 22,18" fill="#f97316"/>
              <rect x="14" y="18" width="8" height="8" fill="none" stroke="#64748b" stroke-width="1.5"/>
              <path d="M4 32 Q12 24 18 24 Q24 24 32 32 Z" fill="none" stroke="#64748b" stroke-width="1.5"/>
              <line x1="2" y1="33" x2="34" y2="33" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2"/>
            </svg>
            <span class="monument-tag" data-i18n="flight.step_3" style="display: none;">ÉTAPE 3</span>
            <span class="monument-name" data-i18n="flight.monument_mont">Mont-Saint-Michel</span>
          </div>
          <div class="monument-pointer" aria-hidden="true"></div>
        </div>

        <!-- Site du Crash & Point d'interrogation mystère à ~92% (sol) -->
        <div id="crash-destination" class="crash-destination">
          <div class="crash-crater"></div>
          <div class="crash-burst" aria-hidden="true"></div>
          <!-- Le Point d'interrogation Minimaliste -->
          <div id="mystery-question-mark" class="mystery-question-mark">
            <div class="question-mark-glyph">?</div>
            <div class="mystery-badge" data-i18n="flight.mystery">Où sommes-nous ?</div>
          </div>
        </div>
      </div>

      <!-- Avion Minimaliste : Silouhette aérodynamique moderne -->
      <div id="airplane-carrier" class="airplane-carrier flying">
        <div class="plane-smoke-trail"></div>
        <div class="plane-wrapper">
          <svg class="plane-svg" viewBox="0 0 80 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Fuselage épuré -->
            <path d="M8 20 C8 15 20 12 36 12 L66 12 C72 12 76 16 76 20 C76 24 72 28 66 28 L36 28 C20 28 8 25 8 20 Z" fill="#f97316"/>
            <!-- Ventre / ombre subtile -->
            <path d="M12 22 C22 25 38 26 64 26 L66 28 L36 28 C20 28 12 25 12 22 Z" fill="#ea580c"/>
            <!-- Cockpit minimaliste -->
            <path d="M50 14 L62 14 C65 14 67 16 65 19 L48 19 C48 16 49 14 50 14 Z" fill="#e0f2fe"/>
            <!-- Dérive de queue -->
            <path d="M10 20 L3 7 C2 5 4.5 4 6 5.5 L18 14 Z" fill="#ea580c"/>
            <!-- Aile principale élégante -->
            <path d="M34 18 L18 4 C16.5 2.5 18.5 1 20.5 2 L45 16 Z" fill="#f97316" stroke="#ea580c" stroke-width="1"/>
            <!-- Hélice / Rotor minimaliste -->
            <g class="plane-propeller">
              <line x1="77" y1="12" x2="77" y2="28" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="77" cy="20" r="2.5" fill="#ea580c"/>
            </g>
          </svg>
        </div>
      </div>

      <!-- Barre de progression au sol fine et épurée -->
      <div class="flight-progress-track">
        <div id="flight-progress-bar" class="flight-progress-bar" style="width: 0%;"></div>
      </div>
    </div>

    <!-- Informations de vol épurées : Pourcentage & Destination intégrés -->
    <div class="flight-footer-info">
      <div class="flight-percentage-box">
        <span id="flight-percentage" class="flight-percentage-val">0%</span>
        <span class="flight-info-dot" aria-hidden="true">•</span>
        <span id="flight-destination-label" class="flight-destination-label" data-i18n="flight.cruising">En vol de croisière...</span>
      </div>
    </div>

    <!-- Barre d'actions et de tests du Loader (Discrète et minimaliste) -->
    <section class="flight-controls-panel" aria-label="Contrôles de test de l'animation">
      <button id="btn-flight-replay" class="ctrl-btn" type="button">
        <span aria-hidden="true">🔄</span>
        <span data-i18n="flight.replay">Rejouer</span>
      </button>

      <button id="btn-flight-pause" class="ctrl-btn" type="button">
        <span id="btn-flight-pause-icon" aria-hidden="true">⏸️</span>
        <span id="btn-flight-pause-label" data-i18n="flight.pause">Pause</span>
      </button>

      <button id="btn-flight-crash" class="ctrl-btn alert-btn" type="button">
        <span aria-hidden="true">💥</span>
        <span data-i18n="flight.crash_now">Crash</span>
      </button>

      <div class="ctrl-slider-group">
        <label for="flight-slider" data-i18n="flight.progress_label">Progression :</label>
        <input type="range" id="flight-slider" class="ctrl-range" min="0" max="100" value="0" step="1" aria-label="Progression du vol" />
      </div>

      <button id="btn-flight-theme" class="ctrl-btn icon-only" type="button" title="Basculer thème" aria-label="Basculer le mode clair ou sombre" data-i18n-aria-label="flight.toggle_theme">
        <span aria-hidden="true">🌓</span>
      </button>
    </section>
  </div>
</div>
