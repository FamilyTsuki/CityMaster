<div
  id="load-screen"
  class="screen load-screen"
  role="region"
  aria-label="Écran de chargement"
  data-i18n-aria-label="common.loading"
>
  <!-- Structure accessible et de secours pour lecteurs d'écran et compatibilité -->
  <div
    class="loader-container"
    style="
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    "
  >
    <div
      class="loader-spinner"
      role="status"
      aria-label="Chargement en cours"
      data-i18n-aria-label="common.loading"
    ></div>
    <p
      id="load-page-message"
      class="loading-message"
      aria-live="polite"
      data-i18n="loading.loading_streets"
    >
      Chargement de CityMaster...
    </p>
  </div>

  <!-- Plateau d'animation Minimaliste du Vol, Trajectoire en Courbe & Nuage Mystère -->
  <div class="flight-loader-stage" role="main">
    <!-- Le Ciel & Trajectoire en courbe épurée -->
    <div id="flight-sky" class="flight-sky">
      <!-- Plateau de Vol Peek : Grille céleste, Globe terrestre, Trajectoire & Texte courbé -->
      <svg
        class="flight-curve-svg"
        viewBox="0 0 1000 560"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <defs>
          <!-- Chemin de texte courbé au-dessus de la trajectoire (parallèle au vol, surélevé dans le ciel) -->
          <path
            id="flight-curve-text-path"
            d="M 40 299 Q 500 160 960 330"
            fill="none"
          />
        </defs>

        <!-- 1. Grille céleste (Méridiens et Parallèles strictement concentriques à la trajectoire de vol) -->
        <g class="peek-sky-grid" opacity="0.28">
          <!-- Parallèles (arcs de même courbure exacte que le vol et la Terre, espacement régulier de 70px) -->
          <path
            d="M -150 159 Q 500 -127 1150 204"
            fill="none"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <path
            d="M -150 229 Q 500 -57 1150 274"
            fill="none"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <path
            d="M -150 299 Q 500 13 1150 344"
            fill="none"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <path
            d="M -150 369 Q 500 83 1150 414"
            fill="none"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <path
            d="M -150 439 Q 500 153 1150 484"
            fill="none"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <path
            d="M -150 509 Q 500 223 1150 554"
            fill="none"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />

          <!-- Méridiens radiaux (rayons perpendiculaires aux parallèles) -->
          <line
            x1="0"
            y1="-30"
            x2="158"
            y2="580"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <line
            x1="145"
            y1="-30"
            x2="253"
            y2="580"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <line
            x1="291"
            y1="-30"
            x2="348"
            y2="580"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <line
            x1="453"
            y1="-30"
            x2="453"
            y2="580"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <line
            x1="607"
            y1="-30"
            x2="554"
            y2="580"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <line
            x1="765"
            y1="-30"
            x2="656"
            y2="580"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <line
            x1="923"
            y1="-30"
            x2="759"
            y2="580"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
          <line
            x1="1045"
            y1="-30"
            x2="838"
            y2="580"
            stroke="rgba(255, 245, 215, 0.5)"
            stroke-width="1.2"
          />
        </g>

        <!-- 2. Étoiles mignonnes de Peek réparties dans l'ensemble du ciel céleste -->
        <g class="peek-sky-stars">
          <!-- Ciel supérieur -->
          <polygon
            points="120,34 122.9,41 130.5,41.6 124.7,46.5 126.5,53.9 120,50 113.5,53.9 115.3,46.5 109.5,41.6 117.1,41"
            fill="rgba(255, 245, 215, 0.38)"
          />
          <polygon
            points="280,16 283.7,24.9 293.3,25.7 286,31.9 288.2,41.3 280,36.3 271.8,41.3 274,31.9 266.7,25.7 276.3,24.9"
            fill="rgba(255, 245, 215, 0.42)"
          />
          <polygon
            points="480,13 483.2,20.6 491.4,21.3 485.1,26.7 487.1,34.7 480,30.4 472.9,34.7 474.9,26.7 468.6,21.3 476.8,20.6"
            fill="rgba(255, 245, 215, 0.35)"
          />
          <polygon
            points="680,20 684,29.5 694.3,30.4 686.4,37.1 688.8,47.1 680,41.8 671.2,47.1 673.6,37.1 665.7,30.4 676,29.5"
            fill="rgba(255, 245, 215, 0.44)"
          />
          <polygon
            points="850,29 852.9,36 860.5,36.6 854.7,41.5 856.5,48.9 850,45 843.5,48.9 845.3,41.5 839.5,36.6 847.1,36"
            fill="rgba(255, 245, 215, 0.36)"
          />
          <polygon
            points="940,52 942.1,57.1 947.6,57.5 943.4,61.1 944.7,66.5 940,63.6 935.3,66.5 936.6,61.1 932.4,57.5 937.9,57.1"
            fill="rgba(255, 245, 215, 0.3)"
          />

          <!-- Ciel moyen et flancs (gauche & droite) -->
          <polygon
            points="65,101 67.4,106.7 73.6,107.2 68.9,111.3 70.3,117.3 65,114.1 59.7,117.3 61.1,111.3 56.4,107.2 62.6,106.7"
            fill="rgba(255, 245, 215, 0.32)"
          />
          <polygon
            points="190,82 193.4,90.3 202.4,91 195.6,96.8 197.6,105.5 190,100.9 182.4,105.5 184.4,96.8 177.6,91 186.6,90.3"
            fill="rgba(255, 245, 215, 0.4)"
          />
          <polygon
            points="370,72 372.1,77.1 377.6,77.5 373.4,81.1 374.7,86.5 370,83.6 365.3,86.5 366.6,81.1 362.4,77.5 367.9,77.1"
            fill="rgba(255, 245, 215, 0.28)"
          />
          <polygon
            points="590,66 592.4,71.7 598.6,72.2 593.9,76.3 595.3,82.3 590,79.1 584.7,82.3 586.1,76.3 581.4,72.2 587.6,71.7"
            fill="rgba(255, 245, 215, 0.3)"
          />
          <polygon
            points="820,83 823.2,90.6 831.4,91.3 825.1,96.7 827.1,104.7 820,100.4 812.9,104.7 814.9,96.7 808.6,91.3 816.8,90.6"
            fill="rgba(255, 245, 215, 0.42)"
          />
          <polygon
            points="910,115 912.6,121.4 919.5,121.9 914.3,126.4 915.9,133.1 910,129.5 904.1,133.1 905.7,126.4 900.5,121.9 907.4,121.4"
            fill="rgba(255, 245, 215, 0.35)"
          />

          <!-- Constellations de mi-ciel et étoiles filantes d'arrière-plan -->
          <polygon
            points="110,180 112.6,186.4 119.5,186.9 114.3,191.4 115.9,198.1 110,194.5 104.1,198.1 105.7,191.4 100.5,186.9 107.4,186.4"
            fill="rgba(255, 245, 215, 0.34)"
          />
          <polygon
            points="220,173 221.9,177.5 226.7,177.8 223,181 224.1,185.7 220,183.2 215.9,185.7 217,181 213.3,177.8 218.1,177.5"
            fill="rgba(255, 245, 215, 0.28)"
          />
          <polygon
            points="770,167 772.1,172.1 777.6,172.5 773.4,176.1 774.7,181.5 770,178.6 765.3,181.5 766.6,176.1 762.4,172.5 767.9,172.1"
            fill="rgba(255, 245, 215, 0.3)"
          />
          <polygon
            points="870,199 872.9,206 880.5,206.6 874.7,211.5 876.5,218.9 870,215 863.5,218.9 865.3,211.5 859.5,206.6 867.1,206"
            fill="rgba(255, 245, 215, 0.36)"
          />
          <polygon
            points="950,233 951.9,237.5 956.7,237.8 953,241 954.1,245.7 950,243.2 945.9,245.7 947,241 943.3,237.8 948.1,237.5"
            fill="rgba(255, 245, 215, 0.25)"
          />
          <polygon
            points="40,252 42.1,257.1 47.6,257.5 43.4,261.1 44.7,266.5 40,263.6 35.3,266.5 36.6,261.1 32.4,257.5 37.9,257.1"
            fill="rgba(255, 245, 215, 0.28)"
          />
        </g>

        <!-- 3. Globe terrestre illustré dézoomé : vue panoramique des continents suivant la courbure de vol -->
        <g class="peek-earth-container">
          <image
            class="peek-earth-img"
            href="/assets/images/earth.png"
            xlink:href="/assets/images/earth.png"
            x="-245"
            y="385"
            width="1400"
            height="1000"
            preserveAspectRatio="none"
          />
        </g>

        <!-- 4. Texte courbé 'Loading...Loading...Loading...Loading..' de Peek (surélevé) -->
        <text class="peek-loading-curve-text">
          <textPath
            href="#flight-curve-text-path"
            startOffset="50%"
            text-anchor="middle"
          >
            Loading...Loading...Loading...Loading..
          </textPath>
        </text>

        <!-- 5. Trajectoire de vol (Base grise Peek + Progression rouge Peek) -->
        <!-- Trajectoire restante (ligne grise/brune Peek) -->
        <path
          class="flight-curve-track peek-track-bg"
          d="M 60 403 Q 500 280 920 426"
          fill="none"
          stroke="#6e6353"
          stroke-width="3"
          stroke-linecap="round"
        />
        <!-- Trajectoire active (ligne rouge Peek traçant le vol) -->
        <path
          id="flight-curve-progress-line"
          class="flight-curve-progress-line"
          d="M 60 403 Q 500 280 920 426"
          fill="none"
          stroke="#e63946"
          stroke-width="3.5"
          stroke-linecap="round"
          stroke-dasharray="874"
          stroke-dashoffset="874"
        />

        <!-- Points d'arrêt : Point rouge de départ et point gris d'arrivée -->
        <circle cx="60" cy="403" r="7" fill="rgba(230, 57, 70, 0.3)" />
        <circle
          cx="60"
          cy="403"
          r="4.5"
          fill="#e63946"
          stroke="#ffffff"
          stroke-width="1.5"
        />
        <circle cx="920" cy="426" r="4.5" fill="#6e6353" />
      </svg>

      <!-- Monuments le long de la trajectoire et Nuage de Destination (Design épuré) -->
      <div class="flight-monuments">
        <!-- Monument 1 : Arc de Triomphe à ~28%, visible UNIQUEMENT quand l'avion y arrive -->
        <div id="monument-1" class="monument-item monument-above">
          <img
            class="monument-icon"
            src="/assets/images/monuments/arc-triomphe.png"
            alt="Arc de Triomphe"
            width="48"
            height="56"
            loading="lazy"
          />
        </div>

        <!-- Monument 2 : Pyramide du Louvre à ~56%, au-dessus du vol -->
        <div id="monument-2" class="monument-item monument-above">
          <img
            class="monument-icon"
            src="/assets/images/monuments/louvre-pyramid.png"
            alt="Pyramide du Louvre"
            width="59"
            height="45"
            loading="lazy"
          />
        </div>

        <!-- Monument 3 : Tour Eiffel à ~78%, au-dessus du vol -->
        <div id="monument-3" class="monument-item monument-above">
          <img
            class="monument-icon"
            src="/assets/images/monuments/eiffel-tower.png"
            alt="Tour Eiffel"
            width="40"
            height="59"
            loading="lazy"
          />
        </div>

        <!-- Nuage de destination mystère à ~80% : L'avion y disparaît en douceur -->
        <div id="destination-cloud" class="destination-cloud">
          <div class="cloud-body">
            <svg
              class="cloud-svg"
              viewBox="0 0 140 80"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <!-- Wisp / ombrelle de base Peek -->
              <path
                d="M14 62 C14 62 26 66 70 66 C114 66 126 62 126 62 C130 62 133 65 127 67 C115 70 70 71 13 67 C7 65 10 62 14 62 Z"
                fill="rgba(110, 95, 75, 0.2)"
              />
              <!-- Cumulus multi-lobes Peek -->
              <path
                d="M26 62 C15 62 10 49 19 40 C17 30 28 20 42 24 C51 9 76 8 88 22 C100 16 114 25 111 37 C123 44 121 60 107 62 Z"
                fill="#f4ecd8"
                stroke="#756750"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <!-- Ombrage intérieur doux Peek -->
              <path
                d="M30 58 C38 54 49 57 56 51 C63 46 79 47 91 54 C100 58 107 55 105 59 Z"
                fill="#e5d9bd"
              />
            </svg>
          </div>
          <!-- Trio de points d'interrogation mystère '???' émergeant du nuage (Style Peek) -->
          <div id="mystery-question-mark" class="mystery-question-mark">
            <div class="question-mark-glyph peek-question-trio">
              <span class="peek-qm qm-left">?</span>
              <span class="peek-qm qm-mid">?</span>
              <span class="peek-qm qm-right">?</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Avion Minimaliste : Silouhette aérodynamique moderne -->
      <div id="airplane-carrier" class="airplane-carrier flying">
        <div class="plane-wrapper">
          <svg
            class="plane-svg"
            viewBox="0 0 80 40"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <!-- Fuselage épuré -->
            <path
              d="M8 20 C8 15 20 12 36 12 L66 12 C72 12 76 16 76 20 C76 24 72 28 66 28 L36 28 C20 28 8 25 8 20 Z"
              fill="#f97316"
            />
            <!-- Ventre / ombre subtile -->
            <path
              d="M12 22 C22 25 38 26 64 26 L66 28 L36 28 C20 28 12 25 12 22 Z"
              fill="#ea580c"
            />
            <!-- Cockpit minimaliste -->
            <path
              d="M50 14 L62 14 C65 14 67 16 65 19 L48 19 C48 16 49 14 50 14 Z"
              fill="#e0f2fe"
            />
            <!-- Dérive de queue -->
            <path d="M10 20 L3 7 C2 5 4.5 4 6 5.5 L18 14 Z" fill="#ea580c" />
            <!-- Aile principale élégante -->
            <path
              d="M34 18 L18 4 C16.5 2.5 18.5 1 20.5 2 L45 16 Z"
              fill="#f97316"
              stroke="#ea580c"
              stroke-width="1"
            />
            <!-- Hélice / Rotor minimaliste -->
            <g class="plane-propeller">
              <line
                x1="77"
                y1="12"
                x2="77"
                y2="28"
                stroke="#cbd5e1"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <circle cx="77" cy="20" r="2.5" fill="#ea580c" />
            </g>
          </svg>
        </div>
      </div>

      <!-- Barre de progression au sol fine et épurée -->
      <div class="flight-progress-track">
        <div
          id="flight-progress-bar"
          class="flight-progress-bar"
          style="width: 0%"
        ></div>
      </div>
    </div>

    <!-- Informations de vol épurées : Pourcentage & Destination intégrés -->
    <div class="flight-footer-info">
      <div class="flight-percentage-box">
        <span id="flight-percentage" class="flight-percentage-val">0%</span>
      </div>
    </div>
  </div>
</div>
