<div id="game-screen" class="screen">
  <div class="map-area">
    <div id="map"></div>

    <div id="map-loader" class="map-overlay-loader">
      <div class="loader-spinner"></div>
      <p id="map-loader-message" data-i18n="game.loading_geo">
        Chargement des données géographiques...
      </p>
    </div>

    <div id="top-banner" class="ui-overlay-top glass-panel hidden">
      <div class="hud-round-indicators" id="round-indicators">
        <span class="round-dot" data-round="1"></span>
        <span class="round-dot" data-round="2"></span>
        <span class="round-dot" data-round="3"></span>
        <span class="round-dot" data-round="4"></span>
        <span class="round-dot" data-round="5"></span>
      </div>

      <span id="game-instruction" class="instruction-text">Chargement...</span>

      <div id="combo-badge" class="combo-badge hidden">
        <span class="combo-icon">⚡</span>
        <span id="combo-text">Combo x2</span>
      </div>

      <div id="timer-container" class="timer-container hidden">
        <div id="timer-bar" class="timer-bar"></div>
      </div>
    </div>

    <div id="bottom-left-actions" class="ui-overlay-bottom-left">
      <button
        id="satellite-toggle-btn"
        class="satellite-btn"
        title="Vue Satellite (Activer/Désactiver)"
        data-i18n-title="game.toggle_satellite"
        aria-label="Basculer la vue satellite"
        data-i18n-aria-label="game.satellite_label"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="satellite-icon"
          aria-hidden="true"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
      </button>
    </div>

    <div id="top-right-actions" class="ui-overlay-top-right">
      <button
        id="quit-btn"
        class="quit-btn"
        title="Quitter la partie (Échap)"
        data-i18n-title="game.quit_title"
        aria-label="Quitter la partie"
        data-i18n-aria-label="game.quit_label"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="action-icon game-action-icon-left"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
      <button
        id="report-btn"
        class="quit-btn report-btn-icon"
        title="Signaler un problème sur cette rue"
        data-i18n-title="game.report_title"
        aria-label="Signaler un problème sur cette voie"
        data-i18n-aria-label="game.report_label"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="action-icon"
          aria-hidden="true"
        >
          <path
            d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"
          ></path>
          <line x1="4" y1="22" x2="4" y2="15"></line>
        </svg>
      </button>
    </div>

    <div id="bottom-actions" class="ui-overlay-bottom glass-panel hidden">
      <div
        id="identify-input-container"
        class="input-container custom-select-container hidden game-input-container"
      >
        <input
          type="text"
          id="street-name-input"
          class="input-premium"
          placeholder="Nom de la rue ou lotissement..."
          data-i18n-placeholder="game.identify_placeholder"
          aria-label="Nom de la voie ou du lotissement"
          data-i18n-aria-label="game.identify_input_label"
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="autocomplete-suggestions"
        />
        <ul
          id="autocomplete-suggestions"
          class="dropdown-list hidden"
          role="listbox"
          aria-label="Suggestions de rues et lotissements"
          data-i18n-aria-label="game.suggestions_label"
        ></ul>
        <button
          id="submit-answer-btn"
          class="btn"
          data-i18n="game.submit_answer"
        >
          Valider la réponse
        </button>
      </div>

      <div id="game-actions" class="action-buttons">
        <button id="validate-btn" class="btn hidden">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="action-icon"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
          <span data-i18n="game.validate_guess"
            >Valider l'emplacement (Espace)</span
          >
        </button>
        <button id="next-btn" class="btn hidden">
          <span data-i18n="game.next_street"
            >Rue Suivante (Entrée / Espace)</span
          >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="action-icon game-action-icon-right"
            aria-hidden="true"
          >
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div id="report-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="report-modal-title" class="modal-title" data-i18n="game.report_modal_title">Signaler un problème</h3>
        <button
          id="report-modal-close-btn"
          type="button"
          class="btn-close"
          aria-label="Fermer la boîte de dialogue"
          data-i18n-aria-label="common.close_dialog"
        >
          &times;
        </button>
      </div>
      <form id="report-form" class="modal-body">
        <div class="report-context-info">
          <p>
            <strong data-i18n="game.report_player">Joueur :</strong>
            <span id="report-user-display">Anonyme</span>
          </p>
          <p>
            <strong data-i18n="game.report_target_street">Rue cible :</strong>
            <span id="report-target-street-display">Aucune</span>
          </p>
          <p id="report-clicked-street-container" class="hidden">
            <strong data-i18n="game.report_clicked_street">Rue cliquée :</strong>
            <span id="report-clicked-street-display">Aucune</span>
          </p>
        </div>

        <div class="form-group">
          <label for="report-category-select" class="form-label" data-i18n="game.report_type_label"
            >Type de problème :</label
          >
          <select
            id="report-category-select"
            class="input input-premium"
            required
          >
            <option value="street_name" data-i18n="game.report_type_name">Rue mal nommée</option>
            <option value="difficulty" data-i18n="game.report_type_diff">Mauvais niveau de difficulté</option>
            <option value="map_error" data-i18n="game.report_type_map">Erreur de tracé / carte</option>
            <option value="other" data-i18n="game.report_type_other">Autre problème</option>
          </select>
        </div>

        <div class="form-group">
          <label for="report-description" class="form-label" data-i18n="game.report_desc_label"
            >Description du problème :</label
          >
          <textarea
            id="report-description"
            class="input textarea input-premium"
            rows="4"
            placeholder="Expliquez précisément le problème rencontré..."
            data-i18n-placeholder="game.report_placeholder"
            required
          ></textarea>
        </div>

        <div id="report-modal-error" class="form-error hidden"></div>

        <div class="modal-actions">
          <button type="submit" id="report-submit-btn" class="btn" data-i18n="game.report_submit">
            Envoyer le signalement
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
