<div id="landing-screen" class="screen">
  <svg width="0" height="0" style="position:absolute; pointer-events:none;" aria-hidden="true">
    <filter id="paper-wobbly-line">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="landing-content">
    <div class="hero">
      <div class="hero-text">
        <h1 class="hero-brand">CityMaster</h1>
        <p class="hero-title" data-i18n="landing.hero_title">Retrouvez chaque rue de <span class="title-highlight">votre ville</span></p>
        <p class="hero-subtitle" data-i18n="landing.hero_subtitle">Un nom de rue s'affiche, vous la pointez sur la carte. Seul ou en salon avec vos amis, sur n'importe quelle commune de France.</p>

        <div class="hero-actions">
          <button id="hero-play-btn" class="btn hero-btn primary-paper-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="action-icon" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
            <span data-i18n="landing.play_now">Jouer maintenant</span>
          </button>
          <button id="hero-room-btn" class="btn hero-btn secondary-paper-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="action-icon" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span data-i18n="landing.team_rooms">Jouer entre amis</span>
          </button>
        </div>
      </div>

      <figure class="hero-preview" aria-hidden="true">
        <div class="preview-map">
          <svg viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
            <rect class="map-ground" width="480" height="340" />
            <path class="map-water" d="M-10 268 C 90 240, 170 300, 270 282 S 420 236, 500 262 L 500 350 L -10 350 Z" />
            <rect class="map-park" x="300" y="44" width="118" height="78" rx="6" />
            <g class="map-streets">
              <path d="M-10 70 L 500 54" />
              <path d="M-10 150 L 500 140" />
              <path d="M-10 222 C 120 214, 300 226, 500 206" />
              <path d="M70 -10 L 84 260" />
              <path d="M170 -10 L 162 248" />
              <path d="M278 -10 L 290 236" />
              <path d="M436 -10 L 428 220" />
              <path d="M84 150 L 162 70" />
            </g>
            <g class="map-lanes">
              <path d="M120 70 L 118 150" />
              <path d="M220 58 L 224 146" />
              <path d="M360 140 L 364 216" />
              <path d="M10 110 L 76 108" />
              <path d="M290 186 L 428 180" />
            </g>
            <path class="map-target" d="M162 146 C 200 152, 240 176, 290 184 S 372 196, 428 180" />
            <path class="map-gap" d="M236 112 L 247 170" />
            <circle class="map-guess" cx="236" cy="112" r="7" />
            <circle class="map-hit" cx="247" cy="171" r="4" />
          </svg>
          <span class="street-plate">Rue des Tanneurs</span>
          <span class="preview-distance">48 m</span>
        </div>
        <figcaption class="preview-meta">
          <span>3 / 10</span>
          <span>920 pts</span>
        </figcaption>
      </figure>
    </div>

    <div class="landing-footer-actions">
      <button id="landing-legal-btn" class="legal-footer-link paper-footer-btn" data-i18n="nav.legal">Mentions légales et RGPD</button>
      <button id="landing-support-btn" class="support-footer-link paper-footer-btn" data-i18n="nav.support">Soutenir le projet</button>
    </div>
  </div>
</div>
